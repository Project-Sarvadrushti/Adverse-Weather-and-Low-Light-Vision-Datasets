name: Dataset Link Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily at 00:30 UTC (≈ 6:00 AM IST)
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  link-check:
    name: Validate Dataset Links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run dataset link checker
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/check_links.py
          
      - name: Commit link status badge data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"

      
          git add link_status.json
          git add meta_status.json
      
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
      
          git commit -m "chore: update dataset link status"
      
          git pull --rebase origin main
          git push origin HEAD:main


